name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, compiler: gcc,   cc: gcc,   cxx: g++,     build_type: Debug }
          - { os: ubuntu-24.04, compiler: gcc,   cc: gcc,   cxx: g++,     build_type: Release }
          - { os: ubuntu-24.04, compiler: clang, cc: clang, cxx: clang++, build_type: Debug }
          - { os: ubuntu-24.04, compiler: clang, cc: clang, cxx: clang++, build_type: Release }
          - { os: macos-latest, compiler: clang, cc: clang, cxx: clang++, build_type: Debug }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v4

      # The integration test skips itself without the ITCH data file,
      # benchmarks are only built to catch compile errors.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
